{% extends 'base.html' %}
{% block title %}Editor de texto{% endblock %}
{% block content %}
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-content">
            <div class="col-md-8">
                <div class="card p-4 shadow-lg">
                    <h2 class="card-title text-center mb-4">
                        Edição de texto extraído
                    </h2>
                    <form action="/salvarTexto" method="POST">
                        <div class="mb-3">
                            <label for="texto" class="form-label">
                                Texto extraído:
                            </label>
                            <textarea class="form-control" name="texto" rows="10" required>{{ texto or '' }}</textarea>
                        </div>
                        <div class="d-flex justify-content-end">
                            <button type="button" class="btn btn-info">
                                Traduzir texto
                            </button>
                            <button type="submit" class="btn btn-success ms-3">
                                Exportar texto
                            </button>
                        </div>
                    </form>
                </div>
                <p align="center" class="mt-3">
                    <a href="/" class="btn btn-primary">Voltar</a>
                </p>
            </div>
        </div>
    </div>
{% endblock%}
